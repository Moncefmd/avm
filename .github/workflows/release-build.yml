name: Release build

on:
  workflow_call:
    inputs:
      upload_artifacts:
        description: Upload packaged binaries for a publishing job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: avm-linux-amd64
            executable: avm
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: avm-linux-arm64
            executable: avm
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: avm-darwin-amd64
            executable: avm
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: avm-darwin-arm64
            executable: avm
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: avm-windows-amd64.exe
            executable: avm.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke-test release binary
        shell: pwsh
        run: |
          $binary = Join-Path (Join-Path (Join-Path target '${{ matrix.target }}') release) '${{ matrix.executable }}'
          & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw "Release binary smoke test failed with exit code $LASTEXITCODE"
          }
      - name: Name asset and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = Join-Path (Join-Path (Join-Path target '${{ matrix.target }}') release) '${{ matrix.executable }}'
          $destination = Join-Path dist '${{ matrix.asset }}'
          Copy-Item -LiteralPath $source -Destination $destination
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          "$digest  ${{ matrix.asset }}" | Set-Content -NoNewline -Encoding utf8 (Join-Path dist '${{ matrix.asset }}.sha256')
      - if: inputs.upload_artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
