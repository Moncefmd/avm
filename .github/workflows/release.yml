name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Match Cargo version to tag
        shell: bash
        run: |
          manifest_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "avm") | .version')"
          test "v${manifest_version}" = "${GITHUB_REF_NAME}"
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  build:
    name: Build release artifacts
    needs: verify
    uses: ./.github/workflows/release-build.yml
    with:
      upload_artifacts: true

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Package release-pinned installers
        shell: pwsh
        run: |
          $placeholder = '@AVM_RELEASE_VERSION@'
          $releaseVersion = '${{ github.ref_name }}'
          $utf8WithoutBom = New-Object System.Text.UTF8Encoding($false)
          $installers = @{
            'scripts/install.sh.in' = 'dist/install.sh'
            'scripts/install.ps1.in' = 'dist/install.ps1'
          }
          foreach ($entry in $installers.GetEnumerator()) {
            $template = [IO.File]::ReadAllText($entry.Key)
            $placeholderCount = [Regex]::Matches(
              $template,
              [Regex]::Escape($placeholder)
            ).Count
            if ($placeholderCount -ne 1) {
              throw "$($entry.Key) must contain exactly one release-version placeholder"
            }
            $rendered = $template.Replace($placeholder, $releaseVersion)
            if ($rendered.Contains($placeholder)) {
              throw "Release-version placeholder remains in $($entry.Key)"
            }
            [IO.File]::WriteAllText($entry.Value, $rendered, $utf8WithoutBom)
          }

          bash -n dist/install.sh
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged install.sh failed bash syntax validation'
          }
          shellcheck dist/install.sh
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged install.sh failed ShellCheck'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'dist/install.ps1'),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            throw ($errors | ForEach-Object Message | Out-String)
          }
      - name: Verify release artifact set
        shell: bash
        run: |
          expected=(
            avm-linux-amd64
            avm-linux-arm64
            avm-darwin-amd64
            avm-darwin-arm64
            avm-windows-amd64.exe
          )
          for asset in "${expected[@]}"; do
            test -f "dist/${asset}"
            test -f "dist/${asset}.sha256"
          done
          test -f dist/install.sh
          test -f dist/install.ps1
          grep -F "EMBEDDED_VERSION='${GITHUB_REF_NAME}'" dist/install.sh
          grep -F "[string] \$Version = '${GITHUB_REF_NAME}'" dist/install.ps1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 12
          cd dist
          sha256sum --check --strict ./*.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
